version: '3.9'

services:
  backend:
    build: ./swift-deliver-backend
    command: npm run dev
    env_file:
      - ./swift-deliver-backend/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./swift-deliver-backend:/app
      - /app/node_modules
    ports:
      - "5005:5005"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: swift-deliver
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  frontend:
    build: ./swift-deliver-frontend
    ports:
      - "80:80"          # Main access point
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data: